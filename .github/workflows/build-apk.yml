name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare gradlew and environment
        run: |
          sed -i 's/\r$//' android-app/gradlew
          chmod +x android-app/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk ./Ecal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ecal-apk
          path: ./Ecal.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Ecal v1.0.0"
          body: "Official Android APK download for Ecal."
          files: ./Ecal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
