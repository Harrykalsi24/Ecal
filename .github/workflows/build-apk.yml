name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Android SDK and environment
        run: |
          sed -i 's/\r$//' android-app/gradlew
          chmod +x android-app/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_output.txt

      - name: Report Build Output
        if: always()
        run: |
          if [ -f "gradle_output.txt" ]; then
            echo "### Gradle Build Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 gradle_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Rename APK
        run: |
          find android-app/app/build/outputs/apk -name "*.apk" -exec cp {} ./Ecal.apk \;
          ls -la ./Ecal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ecal-apk
          path: ./Ecal.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Ecal v1.0.0"
          body: "Official Android APK download for Ecal."
          files: ./Ecal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
