name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Android SDK and environment
        run: |
          sed -i 's/\r$//' android-app/gradlew
          chmod +x android-app/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Release APK
        run: |
          cd android-app
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle_output.txt

      - name: Report Build Output
        if: always()
        run: |
          if [ -f "gradle_output.txt" ]; then
            echo "### Gradle Build Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 gradle_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Locate and Rename Release APK
        run: |
          echo "Searching for Release APK files..."
          APK_PATH=$(find android-app -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android-app -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" ./Ecal.apk
            ls -la ./Ecal.apk
          else
            echo "No APK found. Listing build outputs:"
            find android-app/app/build -maxdepth 4 || true
            exit 1
          fi

      - name: Generate SHA-256 and Release Verification Assets
        env:
          MANIFEST_KEY: ${{ secrets.MANIFEST_PRIVATE_KEY }}
        run: |
          # 1. Generate SHA256 checksum
          sha256sum ./Ecal.apk | awk '{print $1}' > ./Ecal.apk.sha256
          SHA_VALUE=$(cat ./Ecal.apk.sha256)
          echo "APK SHA-256: $SHA_VALUE"

          # 2. Extract Version Info
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android-app/app/build.gradle.kts || echo "1.3.0")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' android-app/app/build.gradle.kts || echo "5")

          # 3. Create release manifest
          cat <<EOF > ./release-manifest.json
{
  "packageName": "com.example.ecal",
  "versionName": "$VERSION_NAME",
  "versionCode": $VERSION_CODE,
  "apkSha256": "$SHA_VALUE",
  "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
}
EOF

          # 4. Sign release manifest if private key secret is available
          if [ -n "$MANIFEST_KEY" ]; then
            echo "Signing release manifest with secret MANIFEST_PRIVATE_KEY..."
            printf "%s\n" "$MANIFEST_KEY" > /tmp/manifest_key.pem
            openssl dgst -sha256 -sign /tmp/manifest_key.pem -out /tmp/sig.bin ./release-manifest.json
            base64 -w 0 /tmp/sig.bin > ./release-manifest.json.sig
            rm -f /tmp/manifest_key.pem /tmp/sig.bin
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ecal-release-assets
          if-no-files-found: ignore
          path: |
            ./Ecal.apk
            ./Ecal.apk.sha256
            ./release-manifest.json
            ./release-manifest.json.sig

      - name: Determine Release Tag
        id: rel_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android-app/app/build.gradle.kts || echo "1.3.0")
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=Ecal $TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_tag.outputs.tag }}
          name: ${{ steps.rel_tag.outputs.name }}
          body: |
            ### Ecal Release ${{ steps.rel_tag.outputs.tag }}
            - Release APK signed with official key
            - SHA-256 integrity checksum included
            - Release manifest and verification metadata
          files: |
            ./Ecal.apk
            ./Ecal.apk.sha256
            ./release-manifest.json
            ./release-manifest.json.sig
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
